name: check

# Rápido e a cada mudança: lint, TypeScript, testes e build. É o que precisa passar para entrar em main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, TypeScript e testes
        run: npm run check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
